<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 673" width="420" height="673" role="img" aria-label="Project Facts: a label in the style of a drug facts panel, listing what the project does, its limits and how to use it" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif"><rect width="420" height="673" rx="6" fill="#0C1021"/><text x="16.0" y="39.0" font-size="30" font-weight="700" text-anchor="start" fill="#FF6400">Project Facts</text><rect x="11" y="46.0" width="398" height="4" fill="#FF6400"/><text x="16.0" y="64.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">Serving size: one installer</text><rect x="11" y="70.0" width="398" height="1" fill="#465374"/><text x="16.0" y="86.0" font-size="12" font-weight="700" text-anchor="start" fill="#F8F8F8">Active ingredient (in each run)</text><text x="404.0" y="86.0" font-size="12" font-weight="700" text-anchor="end" fill="#F8F8F8">Purpose</text><text x="16.0" y="100.0" font-size="12" font-weight="400" text-anchor="start" fill="#F8F8F8">Wine 11.0 (Proton optional)</text><text x="221.6" y="100.0" font-size="12" font-weight="400" text-anchor="start" fill="#F8F8F8">Runs a Windows installer you</text><text x="221.6" y="114.0" font-size="12" font-weight="400" text-anchor="start" fill="#F8F8F8">already have</text><rect x="9.5" y="9.5" width="401" height="114.0" fill="none" stroke="#465374" stroke-width="3"/><text x="16.0" y="151.0" font-size="13" font-weight="700" text-anchor="start" fill="#FCB439">Uses</text><rect x="17" y="159.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="165.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">runs a Windows installer on Linux in its own Wine prefix</text><rect x="17" y="173.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="179.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">shows the exact plan first; nothing runs until you approve it</text><rect x="17" y="187.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="193.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">shows progress and a log; optionally, what the installer changed</text><rect x="9.5" y="131.5" width="401" height="70.0" fill="none" stroke="#465374" stroke-width="3"/><text x="16.0" y="229.0" font-size="13" font-weight="700" text-anchor="start" fill="#FCB439">Warnings</text><text x="16.0" y="247.0" font-size="11.5" fill="#F8F8F8"><tspan font-weight="700">Do not use:</tspan><tspan dx="4">to run an installer you do not trust and expect safety: Wine</tspan></text><text x="16.0" y="261.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">prefixes are not sandboxes.</text><rect x="11" y="266.0" width="398" height="1" fill="#465374"/><text x="16.0" y="279.0" font-size="11.5" fill="#F8F8F8"><tspan font-weight="700">Not for:</tspan><tspan dx="4">finding, downloading or including installers (you supply it),</tspan></text><text x="16.0" y="293.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">launching games, or managing a library.</text><rect x="11" y="298.0" width="398" height="1" fill="#465374"/><text x="16.0" y="311.0" font-size="11.5" fill="#F8F8F8"><tspan font-weight="700">When using this product:</tspan><tspan dx="4">your main Wine prefix (~/.wine) is never used;</tspan></text><text x="16.0" y="325.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">each install gets its own prefix.</text><rect x="11" y="330.0" width="398" height="1" fill="#465374"/><text x="16.0" y="343.0" font-size="11.5" fill="#F8F8F8"><tspan font-weight="700">Ask a maintainer or open an issue if:</tspan><tspan dx="4">an installer stays stuck, or its result</tspan></text><text x="16.0" y="357.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">looks wrong. Compatibility with any particular installer is unverified.</text><rect x="9.5" y="209.5" width="401" height="156.0" fill="none" stroke="#465374" stroke-width="3"/><text x="16.0" y="393.0" font-size="13" font-weight="700" text-anchor="start" fill="#FCB439">Directions</text><rect x="17" y="401.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="407.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">get the release, check it with sha256sum -c SHA256SUMS</text><rect x="17" y="415.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="421.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">open the app, press + New prefix, name it</text><rect x="17" y="429.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="435.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">choose your installer, read the plan, press Run installer</text><rect x="17" y="443.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="449.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">check the exit status and the log</text><rect x="9.5" y="373.5" width="401" height="84.0" fill="none" stroke="#465374" stroke-width="3"/><text x="16.0" y="485.0" font-size="13" font-weight="700" text-anchor="start" fill="#FCB439">Other information</text><rect x="17" y="493.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="499.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">version 1.3.0 (2026-11-18); Linux x86_64; Python 3.11 or newer</text><rect x="17" y="507.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="513.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">licence GPL-3.0-or-later; not audited</text><rect x="17" y="521.0" width="4" height="4" fill="#00C1E4"/><text x="27.0" y="527.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">tested headless on Wine 11.0; complete installs only with installers built</text><text x="27.0" y="541.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">for the test</text><rect x="9.5" y="465.5" width="401" height="84.0" fill="none" stroke="#465374" stroke-width="3"/><text x="16.0" y="577.0" font-size="13" font-weight="700" text-anchor="start" fill="#FCB439">Inactive ingredients</text><text x="16.0" y="591.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">tkinter, bubblewrap (optional), umu-run (optional), ClamAV (optional),</text><text x="16.0" y="605.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">systemd-run, the Python standard library</text><rect x="9.5" y="557.5" width="401" height="56.0" fill="none" stroke="#465374" stroke-width="3"/><text x="16.0" y="641.0" font-size="13" font-weight="700" text-anchor="start" fill="#FCB439">Questions or comments?</text><text x="16.0" y="655.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#F8F8F8">github.com/undecuple/gitfurl</text><rect x="9.5" y="621.5" width="401" height="42.0" fill="none" stroke="#465374" stroke-width="3"/></svg>
