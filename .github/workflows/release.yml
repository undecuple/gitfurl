name: Release

# Builds the graphical app as a single Linux program and, for a version tag, attaches it
# to a DRAFT release. A person reviews and publishes the draft. Running this by hand
# (workflow_dispatch, for example `gh workflow run release.yml --ref main`) is a build-only
# dry run: the same build and smoke test, and the program, THIRD_PARTY.md, BUNDLED.txt and
# SHA256SUMS uploaded as a workflow artifact. It creates no release, tag or draft, so the
# notify workflow (which runs on a published release) does not run either.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04  # an older glibc, so the program runs on more distributions
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$want" = "$have" || { echo "tag $want does not match pyproject version $have"; exit 1; }
      - name: system packages for the window test
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: tools
        run: python -m pip install pytest==8.3.5 ruff==0.11.13 pyinstaller==6.11.1
      - name: lint and test
        run: |
          ruff check .
          PYTHONPATH=src python -m pytest -q
      # The native decoder module (gitfurl._codecs: the cm and rolz stages), built the way the
      # native job in ci.yml builds it, so the program can decode the cm stage.
      - name: Rust toolchain (pinned; rustup is on the runner)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup default 1.99.1
      - name: install the module's build tool
        run: python -m pip install maturin==1.15.0 pytest==8.3.5
      - name: cargo test
        working-directory: native/gitfurl-codecs
        run: cargo test --locked
      - name: build the native module with maturin
        run: sh tools/build_codecs.sh  # writes src/gitfurl/_codecs.abi3.so
      - name: build the program
        run: |
          pyinstaller --onefile --noconfirm --name gitfurl --paths src \
            --hidden-import tkinter --hidden-import gitfurl._codecs \
            --add-data "src/gitfurl/icon.png:gitfurl" \
            src/gitfurl/__main__.py
      - name: smoke test the built program
        run: |
          ./dist/gitfurl cli --version
          ./dist/gitfurl cli doctor | tee doctor.txt
          grep -qx "native decoders: cm, rolz" doctor.txt || { echo "the native module is not in the program"; exit 1; }
          # The window should stay open until timeout stops it (exit status 124).
          set +e
          xvfb-run -a timeout 6 ./dist/gitfurl
          status=$?
          test "$status" = 124 || { echo "window did not stay open (status $status)"; exit 1; }
      # What PyInstaller put into the program, read back from the built file, with the
      # versions of the runner's libraries that CPython reports. THIRD_PARTY.md names the
      # components; this list records what this build actually contains.
      - name: list what PyInstaller bundled
        run: |
          {
            echo "# What PyInstaller bundled into the program: pyi-archive_viewer -l -r -b dist/gitfurl"
            echo "# runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}; PyInstaller $(pyinstaller --version)"
            python -c "import platform,ssl,sqlite3,zlib,pyexpat,tkinter; print('# CPython', platform.python_version()); print('#', ssl.OPENSSL_VERSION); print('# SQLite', sqlite3.sqlite_version); print('# zlib', zlib.ZLIB_RUNTIME_VERSION); print('#', pyexpat.EXPAT_VERSION); print('# Tcl', tkinter.Tcl().eval('info patchlevel'), '/ Tk', tkinter.TkVersion)"
            pyi-archive_viewer -l -r -b dist/gitfurl
          } > bundled.txt
          grep -q "_codecs" bundled.txt || { echo "the native module is not in the bundle list"; exit 1; }
      - name: name the files and write checksums
        run: |
          ref="${GITHUB_REF_NAME:-dev}"
          name="gitfurl-${ref//\//-}-linux-x86_64"  # a branch name may contain slashes
          mkdir out
          cp dist/gitfurl "out/$name"
          cp THIRD_PARTY.md out/THIRD_PARTY.md
          cp bundled.txt out/BUNDLED.txt
          (cd out && sha256sum "$name" THIRD_PARTY.md BUNDLED.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitfurl-linux-x86_64
          path: out/
          if-no-files-found: error

  draft-release:
    needs: build
    # Only a pushed version tag makes a draft; a run started by hand never does, even on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # only this job can create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitfurl-linux-x86_64
          path: out/
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" \
            --notes "Draft of the first release. 1.0.0 does not mean any particular installer works: see the README status table for what has been tested. Check SHA256SUMS before use."
