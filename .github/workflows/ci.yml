name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: no installers, archives, keys or large files are tracked
        run: |
          bad="$(git ls-files | grep -Ei '\.(exe|msi|bin|iso|zip|7z|rar|tar|gz|pem|key|p12|pfx)$' || true)"
          big="$(git ls-files -z | xargs -0 -r du -b | awk '$1 > 1048576 {print $2}')"
          if [ -n "$bad$big" ]; then echo "not allowed in the repository:"; echo "$bad"; echo "$big"; exit 1; fi
      - name: window test needs a virtual display and tkinter
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk shellcheck
      - name: install dev tools
        run: python -m pip install pytest==8.3.5 ruff==0.11.13
      - name: shellcheck
        run: shellcheck tools/sandbox.sh docker/entrypoint.sh .githooks/pre-commit
      - name: lint
        run: ruff check .
      # Tests use mocks only. They need no Wine and no installer.
      - name: test
        run: PYTHONPATH=src python -m pytest -q
