name: Bug report
description: Something does not work as described
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach installers, game files, keys or archives. Logs and screenshots only.
        Best: paste a support report. In the window, press "Copy support report" in the
        Timeline card (or in a prefix's Last run); on the command line, run
        `gitfurl cli report PREFIX`. It replaces the software's names, file names, checksums,
        your user, host and paths, and rounds sizes; nothing is sent anywhere. Read it before
        you paste it.
        Before attaching a log itself, remove your user name and home-folder paths.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: gitfurl version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution, Wine version
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Support report (gitfurl cli report PREFIX), or a log with user name and paths removed
