[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitfurl"
version = "1.0.0"
description = "Helper for running user-supplied Windows installers on Linux through Wine."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "undecuple" }]
keywords = ["wine", "installer", "linux"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/undecuple/gitfurl"
Issues = "https://github.com/undecuple/gitfurl/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gitfurl = "gitfurl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
gitfurl = ["icon.png"]
