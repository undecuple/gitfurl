[package]
name = "gitfurl-codecs"
version = "0.1.0"
edition = "2021"
description = "gitfurl's native decoders (the cm and rolz stages), as a Python extension module"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "gitfurl_codecs"
crate-type = ["cdylib", "rlib"]

[features]
# The Python module; maturin turns it on. `cargo test` and `cargo clippy` without it need no
# Python.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["abi3-py311"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
